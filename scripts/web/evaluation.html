<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HMMWV · 답변 평가</title>
<style>
:root{font:15px/1.65 'Segoe UI','Malgun Gothic',sans-serif;color:#20272b;background:#f7f8f9}*{box-sizing:border-box}body{margin:0}a{color:#236d65;text-decoration:none}a:hover{text-decoration:underline}header{background:#fff;border-bottom:1px solid #e3e6e7;padding:22px max(5vw,24px);display:flex;align-items:center;gap:38px}header strong{font-size:17px}nav{display:flex;gap:24px}nav a{color:#657174}nav .active{color:#20272b;font-weight:650}main{max-width:1140px;margin:48px auto;padding:0 24px 60px}h1{font-size:30px;letter-spacing:-.045em;margin:0 0 6px}h2{font-size:18px;font-weight:600}.muted{color:#748085}.card{background:white;border:1px solid #e2e6e8;border-radius:12px;padding:25px;margin-top:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.metric{font-size:28px;font-weight:600}.small{font-size:12px}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:14px 10px;border-bottom:1px solid #edf0f1;vertical-align:top}th{color:#748085;font-size:12px;font-weight:500}select{font:inherit;border:1px solid #d9dfe1;border-radius:7px;background:white;padding:9px 12px;max-width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.7 'Segoe UI',sans-serif;background:#f7f8f9;padding:16px;border-radius:8px}details{margin:16px 0}summary{cursor:pointer;color:#236d65}.table{overflow:auto}.tag{font-size:12px;color:#316e65;background:#ecf3f1;padding:4px 9px;border-radius:5px}@media(max-width:750px){.grid{grid-template-columns:1fr}header{gap:20px;flex-wrap:wrap}nav{gap:15px}main{margin-top:28px}}
</style></head><body><header><strong>HMMWV <span class="muted">/ 연구</span></strong><nav><a href="/">실행 현황</a><a href="/gold">근거 검토</a><a href="/results">답변 비교</a><a class="active" href="/evaluation">답변 평가</a></nav></header><main id="main">불러오는 중입니다.</main>
<script>
const root=document.querySelector('#main'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={ar_raw:'질문 관련성 · 원점수',ar_report:'질문 관련성 · 보고값',oracle_support:'정답 근거 지지율',required_coverage:'필수 요소 충족률',faithfulness:'검색 문맥 충실도',full_abstention:'완전 답변유보율',correct_abstention:'RAG 적절한 답변유보율',corpus_unanswerable_abstention:'LLM Only 답변유보율'};
const states={NOT_RUN:'평가 전',PARTIAL:'일부 완료',COMPLETED:'평가 완료',COMPLETED_WITH_EVAL_ERRORS:'평가 완료 · 결측 있음',VALIDATION_FAILED:'검증 실패',SUPERSEDED:'이전 기록'};
async function get(url){const r=await fetch(url);if(!r.ok)throw Error('평가 자료를 불러오지 못했습니다.');return r.json()}
async function init(){try{
const d=await get('/api/evaluation'),bench=d.runs.filter(r=>r.mode==='benchmark'),latest=bench.find(r=>r.id===d.current.evaluation_run)||bench[0];
root.innerHTML=`<h1>답변 평가</h1><p class="muted">첫 회차의 답변을 gold-v3 기준으로 재집계했습니다. 이전 평가 기록도 함께 보관합니다.</p><div class="grid"><section class="card"><div class="muted">본 실험 평가</div><div class="metric">${latest?latest.processed:0} <span class="muted">/ ${d.benchmark_answers}</span></div><span class="small muted">${latest?esc(states[latest.status]||latest.status):'평가 모델을 선택한 뒤 실행합니다.'}</span></section><section class="card"><div class="muted">검토 상태</div><div class="metric" style="font-size:22px">연구자 확인 대기</div><span class="small muted">Astra 추가 검토 완료 · 연구자 직접 확인 대기</span></section></div><section class="card"><h2>평가 기록</h2>${d.runs.length?`<select id="run" aria-label="평가 실행 선택">${d.runs.map(r=>`<option value="${esc(r.id)}">${r.is_current?'현재 · 근거 정정':r.mode==='smoke'?'기능 점검':'과거 기준'} · ${esc(r.id)}</option>`).join('')}</select><div id="result"></div>`:'<p class="muted">아직 평가를 실행하지 않았습니다.</p>'}</section>`;
if(d.runs.length){const s=document.querySelector('#run');const wanted=new URLSearchParams(location.search).get('run');if(d.runs.some(x=>x.id===wanted))s.value=wanted;else if(latest)s.value=latest.id;s.onchange=()=>show(s.value);await show(s.value)}
}catch(e){root.textContent=e.message}}
async function show(id){const d=await get('/api/evaluation-run?id='+encodeURIComponent(id)),s=d.summary;document.querySelector('#result').innerHTML=`<p><span class="tag">${esc(states[s.status]||s.status)}</span> <span class="muted small">${esc(s.judge)} · ${s.processed}/${s.expected}</span></p>${s.mode==='smoke'?'<p>가상 질문 3개로 실행 경로를 확인한 기록입니다. 정식 실험의 성능 결과에 포함하지 않습니다.</p>':'<p class="muted small">자동평가 잠정치입니다. 연구자의 직접 검토가 남아 있습니다.</p>'}${s.derivation==='CACHED_JUDGMENTS'?'<p class="muted small">gold-v3 정정본입니다. 저장된 Sol 판정을 재사용하고 S16의 불필요한 요소를 제외했습니다. 새 API 호출은 0회이며 검색·생성 결과는 같습니다. <a href="https://github.com/HyungminYoon1/hmmwv-rag-experiment/blob/main/docs/corrections-20260929.md">정정 내역</a></p>':''}${s.id!==d.current.evaluation_run&&s.mode==='benchmark'?'<p class="tag">과거 기준의 결과입니다. 현재 정정본은 gold-v3-formal-20260929입니다.</p>':''}${s.retrieval?`<p>근거 Recall@5 <strong>${(s.retrieval.all.mean_recall*100).toFixed(1)}%</strong> · 모든 필수 근거 확보 <strong>${s.retrieval.all.complete}/${s.retrieval.all.n}</strong></p>`:''}${s.id.startsWith('sol-revision-formal-')?'<p class="muted small">검토 후 수정한 gold-v2와 평가 규칙을 두 조건에 동일하게 적용했습니다. 질문 관련성은 검증된 기존 값을 재사용하고 근거·요소·유보를 다시 평가했습니다. <a href="https://github.com/HyungminYoon1/hmmwv-rag-experiment/blob/main/experiment/revisions/20260929-v2/결과_업데이트.md">변경 내역과 전후 비교</a></p>':''}${d.results.some(r=>r.stages.relevancy_numeric_recalculation)&&!s.id.startsWith('sol-revision-formal-')&&s.derivation!=='CACHED_JUDGMENTS'?'<p class="muted small">관련성 점수는 저장된 판정과 벡터로 재계산했습니다. 추가 API 호출은 없습니다.</p>':''}<div class="table"><table><thead><tr><th>지표</th><th>조건</th><th>평균</th><th>유효 답변 수</th></tr></thead><tbody>${s.aggregate.filter(a=>a.type==='all'&&a.valid_n).map(a=>`<tr><td>${esc(names[a.metric]||a.metric)}</td><td>${esc(a.condition)}</td><td>${a.mean.toFixed(4)}</td><td>${a.valid_n}</td></tr>`).join('')}</tbody></table></div><p class="small muted">평가기 오류는 평균에서 제외하며 생성 실패는 규칙에 따라 0점으로 처리합니다. 답변불가 질의는 별도 지표로 평가합니다.</p>${d.results.map(r=>`<details><summary>${esc(r.question_id)} · ${esc(r.condition)}${Object.keys(r.errors).length?' · 평가 오류':''}</summary><pre>${esc(JSON.stringify({metrics:r.metrics,stages:r.stages,errors:r.errors},null,2))}</pre></details>`).join('')}`}
init();
</script></body></html>
