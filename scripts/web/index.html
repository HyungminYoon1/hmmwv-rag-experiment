<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HMMWV · 비교 실험</title>
<style>
:root{font:15px/1.65 'Segoe UI','Malgun Gothic',sans-serif;color:#20272b;background:#f7f8f9}*{box-sizing:border-box}body{margin:0}a{color:#236d65;text-decoration:none}a:hover{text-decoration:underline}header{background:#fff;border-bottom:1px solid #e3e6e7;padding:22px max(5vw,24px);display:flex;align-items:center;gap:38px}header strong{letter-spacing:.04em;font-size:17px}nav{display:flex;gap:24px}nav a{color:#657174}nav .active{color:#20272b;font-weight:650}main{max-width:1140px;margin:48px auto;padding:0 24px 60px}h1{font-size:30px;letter-spacing:-.045em;margin:0 0 6px}h2{font-size:18px;font-weight:600}p{margin:6px 0 20px}.muted{color:#748085}.eyebrow{font-size:12px;letter-spacing:.1em;color:#6b777b;text-transform:uppercase}.card{background:white;border:1px solid #e2e6e8;border-radius:12px;padding:25px;margin-top:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.metric{font-size:32px;font-weight:600;letter-spacing:-.03em}.tag{font-size:12px;color:#316e65;background:#ecf3f1;padding:4px 9px;border-radius:5px}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:14px 10px;border-bottom:1px solid #edf0f1;vertical-align:top}th{color:#748085;font-size:12px;font-weight:500}button,select,input{font:inherit;border:1px solid #d9dfe1;border-radius:7px;background:white;padding:9px 12px}button{cursor:pointer;color:#236d65}.filters{display:flex;gap:12px;margin:24px 0}.filters input{flex:1}.question{font-size:18px;font-weight:600;margin:0 0 18px}.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}.answer,pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.75 inherit}pre{background:#f7f8f9;padding:16px;border-radius:8px;font-family:inherit}details{margin:16px 0}summary{cursor:pointer;color:#236d65}progress{width:100%;height:7px;accent-color:#31796f}ul{padding-left:22px}.right{margin-left:auto}.small{font-size:12px}@media(max-width:750px){.grid,.split{grid-template-columns:1fr}header{gap:20px;flex-wrap:wrap}main{margin-top:28px}.filters{flex-wrap:wrap}table{font-size:13px}}
</style></head><body><header><strong>HMMWV <span class="muted">/ 연구</span></strong><nav><a href="/">실행 현황</a><a href="/gold">근거 검토</a><a href="/results">답변 비교</a><a href="/evaluation">답변 평가</a></nav><a class="right small" href="http://127.0.0.1:8766/">교범 검색 ↗</a></header><main id="main">불러오는 중입니다.</main>
<script>
const root=document.querySelector('#main');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const typeName={'single-evidence':'단일 근거','multi-evidence':'다중 근거','unanswerable':'답변불가'};
const stateName={PREPARED:'실행 준비',WARMING:'워밍업',RUNNING:'실행 중',COMPLETED:'수집 완료',STOPPED:'중단'};
async function get(url){let r=await fetch(url);if(!r.ok)throw Error('자료를 불러오지 못했습니다.');return r.json()}
document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')===location.pathname));
async function overview(){const [d,e]=await Promise.all([get('/api/overview'),get('/api/evaluation').catch(()=>null)]);let formal=d.runs.find(x=>x.mode==='formal');let current=formal||d.runs[0];const quality=e?.runs.find(x=>x.mode==='benchmark'&&x.source_run===formal?.id);const qualityState={NOT_RUN:'평가 전',PARTIAL:'평가 진행 중',COMPLETED:'자동평가 완료',COMPLETED_WITH_EVAL_ERRORS:'자동평가 완료 · 결측 있음'};root.innerHTML=`<div class="eyebrow">Local evaluation</div><h1>비교 실험</h1><p class="muted">동일한 Qwen 모델에서 교범 검색의 영향을 비교합니다.</p><div class="grid"><div class="card"><div class="muted">평가 문항</div><div class="metric">60</div><span class="small muted">단일 20 · 다중 30 · 답변불가 10</span></div><div class="card"><div class="muted">본 실험 수집</div><div class="metric">${formal?formal.completed:0}<span class="muted" style="font-size:17px"> / 360</span></div><span class="small muted">두 조건 · 세 회차</span></div><div class="card"><div class="muted">답변 품질 평가</div><div class="metric" style="font-size:23px"><a href="/evaluation">${quality?`${quality.processed} / ${quality.expected}`:'평가 준비'}</a></div><span class="small muted">${quality?esc(qualityState[quality.status]||quality.status):'평가 실행 대기'} · 연구자 확인 대기</span></div></div>${current?`<section class="card"><span class="tag">${esc(stateName[current.state]||current.state)}</span><h2>${esc(current.id)}</h2><progress max="${current.planned}" value="${current.completed}"></progress><p class="small muted">${current.completed} / ${current.planned} 요청${current.error?' · '+esc(current.error):''}</p></section>`:''}<section class="card"><h2>실행 기록</h2><table><thead><tr><th>실행</th><th>종류</th><th>진행</th><th>상태</th></tr></thead><tbody>${d.runs.map(x=>`<tr><td><a href="/results?run=${encodeURIComponent(x.id)}">${esc(x.id)}</a></td><td>${x.mode==='formal'?'본 실험':'개발 시험'}</td><td>${x.completed} / ${x.planned}</td><td>${esc(stateName[x.state]||x.state)}</td></tr>`).join('')}</tbody></table></section>`;}
let gold=[];function goldList(){let needle=document.querySelector('#search').value.toLowerCase(),kind=document.querySelector('#kind').value;document.querySelector('#list').innerHTML=gold.filter(q=>(!kind||q.type===kind)&&(q.id+' '+q.question).toLowerCase().includes(needle)).map(q=>`<article class="card"><div class="eyebrow">${esc(q.id)} · ${typeName[q.type]}</div><p class="question">${esc(q.question)}</p><ul>${q.required_elements.map(x=>`<li>${esc(x.text)}</li>`).join('')}</ul>${q.missing_information?`<p>부족한 정보: ${esc(q.missing_information)}</p>`:''}<p class="small muted">최소 충분 청크: ${q.min_sufficient_chunks??'해당 없음'} · Codex 원문 대조 완료 · 연구자 직접 확인 대기</p>${q.evidence.map(e=>`<details><summary>${esc(e.id)} · ${e.sufficient_chunk_sets.map(c=>c.join(' + ')).join(' / ')}</summary><p>${[...new Set(e.sources.flatMap(s=>s.pdf_pages))].map(p=>`<a href="/source?page=${p}" target="_blank" rel="noopener">PDF ${p}쪽 ↗</a>`).join(' · ')}</p><pre>${esc(e.oracle_text)}</pre></details>`).join('')}${q.review_note?`<p class="small muted">${esc(q.review_note)}</p>`:''}</article>`).join('');}
async function goldPage(){const version=new URLSearchParams(location.search).get('version')||'gold-v3';gold=await get('/api/gold?version='+encodeURIComponent(version));root.innerHTML='<div class="eyebrow">Evidence review</div><h1>정답 근거 · '+esc(version)+'</h1><p class="muted">현재 기준은 gold-v3입니다. 질문과 생성 답변은 같으며, 필수 요소와 동등 근거를 정정했습니다. <a href="/gold?version=gold-v1">gold-v1</a> · <a href="/gold?version=gold-v2">gold-v2</a> · <a href="/gold?version=gold-v3">gold-v3</a></p>'+(version!=='gold-v3'?'<p class="tag">과거 평가 기준입니다.</p>':'')+'<p class="muted">질문별 필수 답변 요소와 원문 위치를 확인합니다. +는 함께 필요한 청크, /는 대체 가능한 조합입니다.</p><div class="filters"><input id="search" aria-label="문항 검색" placeholder="문항 번호 또는 질문 검색"><select id="kind" aria-label="문항 유형"><option value="">전체 유형</option><option value="single-evidence">단일 근거</option><option value="multi-evidence">다중 근거</option><option value="unanswerable">답변불가</option></select></div><div id="list"></div>';document.querySelector('#search').oninput=goldList;document.querySelector('#kind').onchange=goldList;goldList();}
async function results(){let o=await get('/api/overview');let run=new URLSearchParams(location.search).get('run')||o.runs[0]?.id;if(!run){root.textContent='아직 실행 기록이 없습니다.';return}let d=await get('/api/run?id='+encodeURIComponent(run));let questions=[...new Map(d.answers.map(x=>[x.question_id,x.question])).entries()];root.innerHTML=`<div class="eyebrow">Paired answers · Round 1</div><h1>답변 비교</h1><p class="muted">첫 회차의 답변 원문입니다. 생성 완료는 답변의 정확성을 뜻하지 않습니다.</p><div class="filters"><select id="run" aria-label="실행 선택">${o.runs.map(x=>`<option value="${esc(x.id)}" ${x.id===run?'selected':''}>${esc(x.id)}</option>`).join('')}</select><span class="muted">${esc(stateName[d.status.state]||d.status.state)} · ${d.status.completed} / ${d.status.planned}</span></div><div id="answers">${questions.map(([id,q])=>`<article class="card"><div class="eyebrow">${esc(id)}</div><p class="question">${esc(q)}</p><div class="split">${['LLM_ONLY','RAG'].map(c=>{let a=d.answers.find(x=>x.question_id===id&&x.condition===c);return `<section><h2>${c==='RAG'?'RAG':'LLM Only'}</h2>${a?`<div class="answer">${esc(a.answer||a.status)}</div><p class="small muted">${(a.timing_ms.total/1000).toFixed(3)}초 · 입력 ${a.input_tokens}토큰</p>${a.chunks.length?`<details><summary>검색 청크 ${a.chunks.length}개</summary>${a.chunks.map(x=>`<div class="small">${esc(x.id)} · ${x.score.toFixed(4)} · PDF ${x.pdf_pages.join(', ')}</div>`).join('')}</details>`:''}`:'<p class="muted">수집 전</p>'}</section>`}).join('')}</div></article>`).join('')}</div>`;document.querySelector('#run').onchange=e=>location.href='/results?run='+encodeURIComponent(e.target.value);}
async function init(){try{if(location.pathname==='/gold')await goldPage();else if(location.pathname==='/results')await results();else {await overview();setInterval(()=>overview().catch(()=>{}),10000)}}catch(e){root.textContent=e.message}}init();
</script></body></html>
